name: Skill Foundry Real Chromium Smoke

on:
  pull_request:
    paths:
      - 'iphone-skill-foundry/**'
      - '.github/workflows/iphone-skill-foundry-browser-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require preinstalled Chrome browser
        run: |
          command -v google-chrome || command -v google-chrome-stable || command -v chromium
      - name: Install browser driver (CI-only, no app runtime dependency)
        run: python -m pip install 'playwright==1.57.0'
      - name: Exercise actual Chrome DOM, local ZIP and unrun checklist
        run: python -m unittest discover -s iphone-skill-foundry/tests -p 'browser_chromium_smoke.py' -v
