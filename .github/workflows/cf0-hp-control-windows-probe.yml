name: CF-0 HP Control Disposable Windows Probe
on:
  pull_request:
    paths:
      - 'skills/cf0-hp-control/tests/windows_disposable_probe.ps1'
      - '.github/workflows/cf0-hp-control-windows-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disposable-scheduler-test:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout public source
        uses: actions/checkout@v4
      - name: Windows Task Scheduler reversible disposable test
        shell: pwsh
        run: |
          & ./skills/cf0-hp-control/tests/windows_disposable_probe.ps1
      - name: Explicit evidence boundary
        shell: pwsh
        run: |
          Write-Output 'This tests an ephemeral GitHub-hosted Windows runner only.'
          Write-Output 'It does not deploy HP Control v1.3, affect the real owner HP, or enable a remote command adapter.'
