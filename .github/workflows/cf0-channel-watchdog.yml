name: CF-0 Channel Evidence Watchdog
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test receipt evidence classification
        run: python -m unittest discover -s relay/tests -p test_channel_audit.py -v
      - name: Inspect live public queue and receipts (read-only)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python relay/channel_audit.py --live
