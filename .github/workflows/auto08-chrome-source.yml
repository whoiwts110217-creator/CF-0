name: CF-0 AUTO-08 Chrome Single-Tab Source Tests
on:
  push:
    branches: [main]
    paths:
      - 'automation_200/continuation_chrome/**'
      - '.github/workflows/auto08-chrome-source.yml'
  pull_request:
    paths:
      - 'automation_200/continuation_chrome/**'
      - '.github/workflows/auto08-chrome-source.yml'
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test one-tab selection, overlay safety and unknown-result gating
        run: node --test automation_200/continuation_chrome/tests/*.test.mjs
      - name: Probe exactly-once keyboard submission in inert Chromium editor
        run: node automation_200/continuation_chrome/tests/keyboard-browser-smoke.mjs
      - name: Validate Chrome extension source syntax and manifest
        run: |
          node --check automation_200/continuation_chrome/background.js
          node --check automation_200/continuation_chrome/core.mjs
          node --check automation_200/continuation_chrome/popup.js
          node --check automation_200/continuation_chrome/master-control.js
          python -m json.tool automation_200/continuation_chrome/manifest.json > /dev/null
      - name: Build permission-checked owner-installable Chrome extension
        run: python automation_200/continuation_chrome/package.py "$RUNNER_TEMP/cf0-auto08-chrome"
      - name: Upload owner-installable Chrome extension ZIP
        uses: actions/upload-artifact@v4
        with:
          name: CF0-AUTO08-Chrome-v0.1.6
          path: ${{ runner.temp }}/cf0-auto08-chrome/
          if-no-files-found: error
          retention-days: 30
