name: CF-0 Prompt Efficiency Approval Guard
on:
  push:
    branches: [main]
    paths:
      - 'automation_200/MASTER_OPERATOR_PROMPT.md'
      - 'automation_200/MASTER_CONTINUITY_PROMPT.md'
      - 'automation_200/WORK_COPY_PASTE_AUTOMATION_PROMPT.md'
      - 'automation_200/PROMPT_CHANGE_BIN.md'
      - 'automation_200/PROMPT_CHANGE_LOG.jsonl'
      - 'automation_200/prompt_change_guard.py'
      - 'automation_200/tests/test_prompt_change_guard.py'
      - '.github/workflows/prompt-efficiency-guard.yml'
      - 'docs/PUBLIC_CONTEXT_GRAPH.json'
      - 'docs/PUBLIC_THREE_CHAT_CONTINUITY_MESH.md'
      - 'docs/PROJECTS.md'
      - 'continuity/public_topic_router.py'
      - 'continuity/tests/test_public_topic_router.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 'Unit tests: preserve owner boundaries and detect silent edits'
        run: python -m unittest discover -s automation_200/tests -p 'test_prompt_change_guard.py' -v
      - name: Test public three-chat mesh topic routing and broken-link gates
        run: |
          python -m unittest discover -s continuity/tests -p 'test_public_topic_router.py' -v
          python -m continuity.public_topic_router --check-all
      - name: Validate operating prompts against append-only change record
        run: python -m automation_200.prompt_change_guard
