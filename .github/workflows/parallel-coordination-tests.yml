name: Parallel coordination isolated tests

on:
  push:
    branches:
      - experiment/parallel-coordination-v1
    paths:
      - "experiments/parallel_coordination/**"
      - ".github/workflows/parallel-coordination-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run isolated Python unittest suite
        working-directory: experiments/parallel_coordination
        run: python3 -m unittest discover -v -p 'test_*.py'
