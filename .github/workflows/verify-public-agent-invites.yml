name: Verify CF-0 agent invitations read-only
on:
  push:
    branches: [main]
    paths:
      - 'ai_tracker/verify_public_agent_invites_2026_11_07.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Find public invitation records (GET only)
        run: python ai_tracker/verify_public_agent_invites_2026_11_07.py
      - name: Commit sanitized listing check
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/AGENT_PUBLIC_LISTING_CHECK_2026_11_07.json
          if ! git diff --cached --quiet; then
            git commit -m "Record public readback of CF-0 outreach posts"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
