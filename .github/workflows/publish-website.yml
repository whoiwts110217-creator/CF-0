name: Publish Caveman Focus Website
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'i18n/**'
      - 'agent-tasks.json'
      - 'llms.txt'
      - 'docs/START_HERE.md'
      - 'concepts/dreamkiller/iphone-emu/site/**'
      - 'concepts/dreamkiller/iphone-emu/tests/**'
      - 'automation_200/mission_control/dist/**'
      - 'automation_200/mission_control/tests/**'
      - 'automation_200/mission_control/build_snapshot.py'
      - 'automation_200/mission_control/test_build_snapshot.py'
      - 'automation_200/registry.json'
      - 'docs/PUBLIC_CONTINUITY_STATE.json'
      - '.github/workflows/publish-website.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: cf0-public-website
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Test public snapshot boundaries
        run: python -m unittest discover -s automation_200/mission_control -p 'test_build_snapshot.py'
      - name: Test Mission Control source loading
        run: node --test automation_200/mission_control/tests/model.test.mjs
      - name: Test optional homepage languages
        run: node --test i18n/home.test.mjs
      - name: Build commit-pinned public Mission Control fallback
        run: python automation_200/mission_control/build_snapshot.py
      - name: Validate iPhone Game Boy emulator web-app package
        run: |
          python -m unittest discover -s concepts/dreamkiller/iphone-emu/tests -p 'test_*.py' -v
          node --check concepts/dreamkiller/iphone-emu/site/app.js
          node --check concepts/dreamkiller/iphone-emu/site/service-worker.js
      - name: Launch first Dreamkiller Road ROM inside browser emulator
        run: |
          node --check concepts/dreamkiller/iphone-emu/tests/browser_smoke.mjs
          node concepts/dreamkiller/iphone-emu/tests/browser_smoke.mjs
      - name: Stage curated public website and Dreamkiller emulator
        shell: bash
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          mkdir -p _site/i18n
          cp i18n/home.mjs _site/i18n/home.mjs
          cp agent-tasks.json _site/agent-tasks.json
          cp llms.txt _site/llms.txt
          mkdir -p _site/mission-control
          cp -R automation_200/mission_control/dist/. _site/mission-control/
          mkdir -p _site/dreamkiller
          cp -R concepts/dreamkiller/iphone-emu/site/. _site/dreamkiller/
          printf '%s\n' 'User-agent: *' 'Allow: /' > _site/robots.txt
      - name: Verify owner navigation links in staged site
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          home = Path("_site/index.html").read_text(encoding="utf-8")
          locale = Path("_site/i18n/home.mjs").read_text(encoding="utf-8")
          assert 'id="language-picker"' in home and 'id="current-language">EN' in home
          assert 'src="./i18n/home.mjs"' in home
          assert '"Español"' in locale and '"Français"' in locale and '"Português"' in locale
          dashboard = Path("_site/mission-control/index.html").read_text(encoding="utf-8")
          import json
          tasks = json.loads(Path("_site/agent-tasks.json").read_text(encoding="utf-8"))
          assert tasks["schema"] == "cf0.open_agent_microtasks.v1"
          assert tasks["challenge_url"].startswith("https://github.com/")
          assert Path("_site/llms.txt").stat().st_size > 100
          assert Path("_site/dreamkiller/index.html").is_file()
          assert Path("_site/dreamkiller/GameBoy.min.js").stat().st_size > 500000
          assert Path("_site/dreamkiller/road-test.gb").stat().st_size == 32768
          assert Path("_site/dreamkiller/road-v01.gb").stat().st_size == 32768
          assert Path("_site/dreamkiller/GPL-2.0.txt").is_file()
          expected = [
              "https://github.com/whoiwts110217-creator/CF-0/blob/main/automation_200/MASTER_OPERATOR_PROMPT.md",
              "https://github.com/whoiwts110217-creator/CF-0/blob/main/docs/START_HERE.md",
              "https://github.com/whoiwts110217-creator/CF-0/tree/feature/ai-agent-tracker/ai_tracker",
          ]
          for name, page in (("homepage", home), ("mission-control", dashboard)):
              for url in expected:
                  assert url in page, f"{name} missing owner shortcut: {url}"
          assert 'href="./mission-control/"' in home, "homepage missing dashboard route"
          assert 'href="../"' in dashboard, "dashboard missing home route"
          print("Owner navigation smoke test passed")
          PY
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
