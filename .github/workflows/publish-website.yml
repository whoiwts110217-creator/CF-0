name: Publish Caveman Focus Website
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'first-drop/**'
      - 'clarity-card/**'
      - 'clarity-brief/**'
      - 'clarity-check/**'
      - 'sitemap.xml'
      - 'i18n/**'
      - 'agent-tasks.json'
      - 'llms.txt'
      - 'docs/START_HERE.md'
      - 'concepts/dreamkiller/iphone-emu/site/**'
      - 'concepts/dreamkiller/rom_v0_2/**'
      - 'concepts/dreamkiller/iphone-emu/tests/**'
      - 'automation_200/mission_control/dist/**'
      - 'iphone-skill-foundry/**'
      - 'link-vault/**'
      - 'automation_200/mission_control/tests/**'
      - 'automation_200/mission_control/build_snapshot.py'
      - 'automation_200/mission_control/test_build_snapshot.py'
      - 'automation_200/registry.json'
      - 'docs/PUBLIC_CONTINUITY_STATE.json'
      - 'docs/CURRENT_SOURCE_GATEWAY.md'
      - 'docs/FRESHNESS_CATALOG.json'
      - 'docs/UNIVERSAL_FRESHNESS_CONTRACT.md'
      - 'docs/OWNER_JUNGLE_MAP.md'
      - 'continuity/public_freshness.py'
      - 'continuity/tests/test_public_freshness.py'
      - '.github/workflows/publish-website.yml'
  # Recovery: dispatch a NEW workflow run after a Pages queue failure.
  # Do not rerun only the failed deploy job: upload-pages-artifact can create
  # another artifact named github-pages in the same run, and deploy-pages
  # rejects multiple matching artifacts (observed in run 42739858197).
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
# With frequent CF-0 commits, cancelling active Pages builds can starve all deployments.
# Let one active build finish and keep the newest queued build; do not cancel running release.
concurrency:
  group: cf0-public-website
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Test public snapshot boundaries
        run: python -m unittest discover -s automation_200/mission_control -p 'test_build_snapshot.py'
      - name: Test Mission Control source loading
        run: node --test automation_200/mission_control/tests/*.test.mjs
      - name: Validate universal latest-source routes for every indexed project family
        run: |
          python -m continuity.public_freshness
          python -m unittest discover -s continuity/tests -p 'test_public_freshness.py' -v
      - name: Test optional homepage languages
        run: node --test i18n/home.test.mjs
      - name: Test public Clarity Card tool and funding boundaries
        run: node --test clarity-card/tests/*.test.mjs
      - name: Test paid pilot disclosures and public inquiry
        run: node --test clarity-brief/tests/*.test.mjs
      - name: Test $5 public-page buyer and intake safeguards
        run: node --test clarity-check/tests/*.test.mjs
      - name: Test First Drop iPhone sharing and copy fallbacks
        run: node --test first-drop/tests/*.test.mjs
      - name: Build commit-pinned public Mission Control fallback
        run: python automation_200/mission_control/build_snapshot.py
      - name: Rebuild Dreamkiller v0.2 cartridge from public source
        run: python3 concepts/dreamkiller/rom_v0_2/build_v02.py
      - name: Validate iPhone Game Boy emulator web-app package
        run: |
          python -m unittest discover -s concepts/dreamkiller/iphone-emu/tests -p 'test_*.py' -v
          node --check concepts/dreamkiller/iphone-emu/site/app.js
          node --check concepts/dreamkiller/iphone-emu/site/service-worker.js
      # The ROM pixel-output compatibility test is preserved as a separate,
      # independently failing Dreamkiller Browser ROM Compatibility workflow.
      # A prototype game's blank frame must not prevent the CF-0 public status,
      # Mission Control, and English-first homepage from deploying.
      - name: Validate Skill Foundry iPhone web app
        run: |
          python -m unittest discover -s iphone-skill-foundry/tests -p 'test_*.py' -v
          node --test iphone-skill-foundry/tests/export_runtime.test.cjs iphone-skill-foundry/tests/cache_scope.test.cjs
      - name: Stage curated public website and Dreamkiller emulator
        shell: bash
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp sitemap.xml _site/sitemap.xml
          mkdir -p _site/first-drop
          cp first-drop/index.html _site/first-drop/index.html
          mkdir -p _site/clarity-card
          cp clarity-card/index.html _site/clarity-card/index.html
          mkdir -p _site/clarity-brief
          cp clarity-brief/index.html _site/clarity-brief/index.html
          mkdir -p _site/clarity-check
          cp clarity-check/index.html _site/clarity-check/index.html
          mkdir -p _site/i18n
          cp i18n/home.mjs _site/i18n/home.mjs
          cp agent-tasks.json _site/agent-tasks.json
          cp llms.txt _site/llms.txt
          mkdir -p _site/mission-control
          cp -R automation_200/mission_control/dist/. _site/mission-control/
          mkdir -p _site/skill-foundry
          cp iphone-skill-foundry/index.html iphone-skill-foundry/manifest.webmanifest iphone-skill-foundry/icon.svg iphone-skill-foundry/apple-touch-icon.png iphone-skill-foundry/sw.js _site/skill-foundry/
          mkdir -p _site/link-vault
          cp link-vault/index.html link-vault/manifest.webmanifest link-vault/icon.svg link-vault/sw.js _site/link-vault/
          mkdir -p _site/dreamkiller
          cp -R concepts/dreamkiller/iphone-emu/site/. _site/dreamkiller/
          cp concepts/dreamkiller/rom_v0_2/dreamkiller_road_v0_2.gb _site/dreamkiller/road-v02.gb
          printf '%s\n' 'User-agent: *' 'Allow: /' > _site/robots.txt
      - name: Verify owner navigation links in staged site
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          home = Path("_site/index.html").read_text(encoding="utf-8")
          locale = Path("_site/i18n/home.mjs").read_text(encoding="utf-8")
          assert 'id="language-picker"' in home and 'id="current-language">EN' in home
          assert 'src="./i18n/home.mjs"' in home
          assert Path("_site/sitemap.xml").is_file(), "first-drop sitemap not staged"
          assert Path("_site/clarity-card/index.html").is_file(), "Clarity Card not staged"
          assert Path("_site/clarity-brief/index.html").is_file(), "Clarity Brief offer not staged"
          assert Path("_site/clarity-check/index.html").is_file(), "$5 Clarity Check offer not staged"
          assert '/clarity-brief/' in Path("_site/sitemap.xml").read_text(encoding="utf-8"), "Service sitemap missing"
          first_drop = Path("_site/first-drop/index.html").read_text(encoding="utf-8")
          assert "Founding Hall of Fame" in first_drop
          assert "https://cash.app/$LAZYBLACKBEAN" in first_drop
          assert 'href="./first-drop/"' in home, "homepage missing first-drop link"
          assert "https://whoiwts110217-creator.github.io/CF-0/first-drop/" in Path("_site/sitemap.xml").read_text(encoding="utf-8")
          assert '"Español"' in locale and '"Français"' in locale and '"Português"' in locale
          dashboard = Path("_site/mission-control/index.html").read_text(encoding="utf-8")
          import json
          tasks = json.loads(Path("_site/agent-tasks.json").read_text(encoding="utf-8"))
          assert tasks["schema"] == "cf0.open_agent_microtasks.v1"
          assert tasks["challenge_url"].startswith("https://github.com/")
          assert Path("_site/llms.txt").stat().st_size > 100
          assert Path("_site/dreamkiller/index.html").is_file()
          assert Path("_site/skill-foundry/index.html").is_file(), "Skill Foundry missing from staged site"
          assert Path("_site/skill-foundry/sw.js").is_file(), "Skill Foundry offline worker missing"
          assert Path("_site/link-vault/index.html").is_file(), "iPhone Link Vault missing"
          assert Path("_site/link-vault/manifest.webmanifest").is_file(), "Link Vault PWA manifest missing"
          assert Path("_site/link-vault/sw.js").is_file(), "Link Vault offline worker missing"
          assert Path("_site/dreamkiller/GameBoy.min.js").stat().st_size > 500000
          assert Path("_site/dreamkiller/road-test.gb").stat().st_size == 32768
          assert Path("_site/dreamkiller/road-v01.gb").stat().st_size == 32768
          from hashlib import sha256
          new_rom = Path("_site/dreamkiller/road-v02.gb")
          assert new_rom.stat().st_size == 32768
          assert sha256(new_rom.read_bytes()).hexdigest() == "df42c2a1d155b929cef09d4648b9ac80e95eb4a6eab8da44da894fa98f57ee2c"
          assert Path("_site/dreamkiller/GPL-2.0.txt").is_file()
          expected = [
              "https://github.com/whoiwts110217-creator/CF-0/blob/main/automation_200/MASTER_OPERATOR_PROMPT.md",
              "https://github.com/whoiwts110217-creator/CF-0/blob/main/docs/START_HERE.md",
              "https://github.com/whoiwts110217-creator/CF-0/tree/feature/ai-agent-tracker/ai_tracker",
          ]
          for name, page in (("homepage", home), ("mission-control", dashboard)):
              for url in expected:
                  assert url in page, f"{name} missing owner shortcut: {url}"
          assert 'href="./mission-control/"' in home, "homepage missing dashboard route"
          assert 'href="../"' in dashboard, "dashboard missing home route"
          print("Owner navigation smoke test passed")
          PY
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
