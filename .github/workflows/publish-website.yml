name: Publish Caveman Focus Website
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'archive/first-drop/**'
      - 'updates/**'
      - 'archive/clarity-card/**'
      - 'archive/clarity-brief/**'
      - 'archive/clarity-check/**'
      - 'sitemap.xml'
      - 'i18n/**'
      - 'agent-tasks.json'
      - 'llms.txt'
      - 'docs/START_HERE.md'
      - 'archive/concepts/dreamkiller/iphone-emu/site/**'
      - 'archive/concepts/dreamkiller/rom_v0_2/**'
      - 'archive/concepts/dreamkiller/iphone-emu/tests/**'
      - 'automation_200/mission_control/dist/**'
      - 'archive/iphone-skill-foundry/**'
      - 'archive/link-vault/**'
      - 'automation_200/mission_control/tests/**'
      - 'automation_200/mission_control/build_snapshot.py'
      - 'automation_200/mission_control/test_build_snapshot.py'
      - 'automation_200/registry.json'
      - 'docs/PUBLIC_CONTINUITY_STATE.json'
      - 'docs/CURRENT_SOURCE_GATEWAY.md'
      - 'docs/FRESHNESS_CATALOG.json'
      - 'docs/UNIVERSAL_FRESHNESS_CONTRACT.md'
      - 'docs/OWNER_JUNGLE_MAP.md'
      - 'continuity/public_freshness.py'
      - 'continuity/tests/test_public_freshness.py'
      - '.github/workflows/publish-website.yml'
      - 'site_deploy/**'
      - 'archive/spider-puzzle/**'
      - 'docs/spider-puzzle/index.html'
      - 'docs/spider/SPIDER_MILLENNIUM_PUZZLE_OWNER_INTENT_ALIASES_V1.json'
  # Upload and deploy are separate jobs. deploy-pages lists artifacts as soon
  # as it starts; in the same job as the upload, that list is often still empty
  # (run 45320899481 found 0 artifacts about 300ms after a successful upload;
  # actions/deploy-pages#451). A later job sees the artifact after the upload
  # job has finished. Re-running only the failed deploy step of a combined job
  # also uploads a second github-pages artifact and then fails as a duplicate
  # (issue #80, run 42739858197). Dispatch a new run when a Pages queue failure
  # needs a fresh attempt.
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
# With frequent CF-0 commits, cancelling active Pages builds can starve all deployments.
# Let one active build finish and keep the newest queued build; do not cancel running release.
concurrency:
  group: cf0-public-website
  cancel-in-progress: false
jobs:
  # Tests, staging, and the Pages artifact. This job does not deploy.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Test public snapshot boundaries
        run: python -m unittest discover -s automation_200/mission_control -p 'test_build_snapshot.py'
      - name: Test Mission Control source loading
        run: node --test automation_200/mission_control/tests/*.test.mjs
      - name: Validate universal latest-source routes for every indexed project family
        run: |
          python -m continuity.public_freshness
          python -m unittest discover -s continuity/tests -p 'test_public_freshness.py' -v
      - name: Test optional homepage languages
        run: node --test i18n/home.test.mjs
      - name: Test public Clarity Card tool and funding boundaries
        run: node --test archive/clarity-card/tests/*.test.mjs
      - name: Test paid pilot disclosures and public inquiry
        run: node --test archive/clarity-brief/tests/*.test.mjs
      - name: Test $5 public-page buyer and intake safeguards
        run: node --test archive/clarity-check/tests/*.test.mjs
      - name: Test live Pages readback verifier (offline)
        run: python -m unittest discover -s site_deploy/tests -p 'test_*.py' -v
      - name: Test First Drop iPhone sharing and copy fallbacks
        run: node --test archive/first-drop/tests/*.test.mjs
      - name: Build commit-pinned public Mission Control fallback
        run: python automation_200/mission_control/build_snapshot.py
      - name: Rebuild Dreamkiller v0.2 cartridge from public source
        run: python3 archive/concepts/dreamkiller/rom_v0_2/build_v02.py
      - name: Validate iPhone Game Boy emulator web-app package
        run: |
          python -m unittest discover -s archive/concepts/dreamkiller/iphone-emu/tests -p 'test_*.py' -v
          node --check archive/concepts/dreamkiller/iphone-emu/site/app.js
          node --check archive/concepts/dreamkiller/iphone-emu/site/service-worker.js
      - name: Validate updateable iPhone Link Vault
        run: |
          python -m unittest discover -s archive/link-vault/tests -p "test_*.py" -v
          node --check archive/link-vault/enhance.js
          node --check archive/link-vault/privacy-controls.js
          node --check archive/link-vault/owner-actions.js
          node --check archive/link-vault/spider-core.js
          node --check archive/link-vault/spider-shell.js
          node --test archive/link-vault/tests/*.test.mjs
          node --check archive/link-vault/sw.js
          python -m json.tool archive/link-vault/owner-actions.json > /dev/null
      # The ROM pixel-output compatibility test is preserved as a separate,
      # independently failing Dreamkiller Browser ROM Compatibility workflow.
      # A prototype game's blank frame must not prevent the CF-0 public status,
      # Mission Control, and English-first homepage from deploying.
      - name: Validate Skill Foundry iPhone web app
        run: |
          python -m unittest discover -s archive/iphone-skill-foundry/tests -p 'test_*.py' -v
          node --test archive/iphone-skill-foundry/tests/export_runtime.test.cjs archive/iphone-skill-foundry/tests/cache_scope.test.cjs
      - name: Test Spider Millennium Puzzle manual mobile workbench
        run: node --test archive/spider-puzzle/test_workbench.mjs archive/spider-puzzle/test_full.mjs archive/spider-puzzle/test_lab.mjs
      - name: Test the assembled Spider package
        run: python -m unittest discover -s archive/spider-puzzle -p 'test_assemble.py' -v
      - name: Stage curated public website and Dreamkiller emulator
        shell: bash
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp sitemap.xml _site/sitemap.xml
          mkdir -p _site/updates
          cp updates/index.html updates/feed.xml _site/updates/
          mkdir -p _site/first-drop
          cp archive/first-drop/index.html _site/first-drop/index.html
          mkdir -p _site/clarity-card
          cp archive/clarity-card/index.html _site/clarity-card/index.html
          mkdir -p _site/clarity-brief
          cp archive/clarity-brief/index.html _site/clarity-brief/index.html
          mkdir -p _site/clarity-check
          cp archive/clarity-check/index.html _site/clarity-check/index.html
          mkdir -p _site/i18n
          cp i18n/home.mjs _site/i18n/home.mjs
          cp agent-tasks.json _site/agent-tasks.json
          cp llms.txt _site/llms.txt
          mkdir -p _site/mission-control
          cp -R automation_200/mission_control/dist/. _site/mission-control/
          mkdir -p _site/skill-foundry
          cp archive/iphone-skill-foundry/index.html archive/iphone-skill-foundry/manifest.webmanifest archive/iphone-skill-foundry/icon.svg archive/iphone-skill-foundry/apple-touch-icon.png archive/iphone-skill-foundry/sw.js _site/skill-foundry/
          mkdir -p _site/link-vault
          cp archive/link-vault/index.html archive/link-vault/enhance.js archive/link-vault/privacy-controls.js archive/link-vault/links.json archive/link-vault/owner-actions.js archive/link-vault/spider-core.js archive/link-vault/spider-shell.js archive/link-vault/owner-actions.css archive/link-vault/owner-actions.json archive/link-vault/manifest.webmanifest archive/link-vault/icon.svg archive/link-vault/sw.js _site/link-vault/
          mkdir -p _site/spider-puzzle
          cp archive/spider-puzzle/index.html _site/spider-puzzle/index.html
          cp archive/spider-puzzle/workbench.html _site/spider-puzzle/workbench.html
          cp archive/spider-puzzle/full.html _site/spider-puzzle/full.html
          python archive/spider-puzzle/assemble.py --output _site/spider-puzzle/CF0-Spider-Assembled-v1.zip
          cp docs/spider-puzzle/index.html _site/spider-puzzle/atlas.html
          cp docs/spider/SPIDER_MILLENNIUM_PUZZLE_OWNER_INTENT_ALIASES_V1.json _site/spider-puzzle/owner-aliases.json
          mkdir -p _site/dreamkiller
          cp -R archive/concepts/dreamkiller/iphone-emu/site/. _site/dreamkiller/
          cp archive/concepts/dreamkiller/rom_v0_2/dreamkiller_road_v0_2.gb _site/dreamkiller/road-v02.gb
          printf '%s\n' 'User-agent: *' 'Allow: /' > _site/robots.txt
          python -m site_deploy.verify_live write-manifest _site "$GITHUB_SHA" "$GITHUB_RUN_ID"
      - name: Verify owner navigation links in staged site
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          home = Path("_site/index.html").read_text(encoding="utf-8")
          locale = Path("_site/i18n/home.mjs").read_text(encoding="utf-8")
          assert 'id="language-picker"' in home and 'id="current-language">EN' in home
          assert 'src="./i18n/home.mjs"' in home
          assert Path("_site/sitemap.xml").is_file(), "first-drop sitemap not staged"
          assert Path("_site/updates/index.html").is_file(), "Owned updates page not staged"
          assert Path("_site/updates/feed.xml").is_file(), "Owned RSS feed not staged"
          from xml.etree import ElementTree as ET
          feed = ET.parse("_site/updates/feed.xml").getroot()
          assert feed.tag == "rss"
          assert len(feed.findall("./channel/item")) >= 3, "Insufficient public release notes"
          assert 'type="application/rss+xml"' in home, "Homepage RSS autodiscovery missing"
          assert Path("_site/clarity-card/index.html").is_file(), "Clarity Card not staged"
          assert Path("_site/clarity-brief/index.html").is_file(), "Clarity Brief offer not staged"
          assert Path("_site/clarity-check/index.html").is_file(), "$5 Clarity Check offer not staged"
          assert '/clarity-brief/' in Path("_site/sitemap.xml").read_text(encoding="utf-8"), "Service sitemap missing"
          first_drop = Path("_site/first-drop/index.html").read_text(encoding="utf-8")
          assert "Founding Hall of Fame" in first_drop
          assert "https://cash.app/$LAZYBLACKBEAN" in first_drop
          assert 'href="./first-drop/"' in home, "homepage missing first-drop link"
          assert "https://whoiwts110217-creator.github.io/CF-0/first-drop/" in Path("_site/sitemap.xml").read_text(encoding="utf-8")
          assert '"Español"' in locale and '"Français"' in locale and '"Português"' in locale
          dashboard = Path("_site/mission-control/index.html").read_text(encoding="utf-8")
          import json
          tasks = json.loads(Path("_site/agent-tasks.json").read_text(encoding="utf-8"))
          assert tasks["schema"] == "cf0.open_agent_microtasks.v1"
          assert tasks["challenge_url"].startswith("https://github.com/")
          assert Path("_site/llms.txt").stat().st_size > 100
          assert Path("_site/dreamkiller/index.html").is_file()
          assert Path("_site/skill-foundry/index.html").is_file(), "Skill Foundry missing from staged site"
          assert Path("_site/skill-foundry/sw.js").is_file(), "Skill Foundry offline worker missing"
          assert Path("_site/link-vault/index.html").is_file(), "iPhone Link Vault missing"
          assert Path("_site/spider-puzzle/workbench.html").is_file(), "Manual puzzle board missing from staged site"
          assert Path("_site/spider-puzzle/full.html").stat().st_size > 30000, "Full 1289-piece puzzle viewer missing from staged site"
          from zipfile import ZipFile
          with ZipFile("_site/spider-puzzle/CF0-Spider-Assembled-v1.zip") as assembled:
              assert assembled.testzip() is None, "Assembled Spider ZIP corrupt"
              assert 'assembled_spider.py' in assembled.namelist(), "Spider program launcher missing"
          mobile = Path("_site/spider-puzzle/index.html").read_text(encoding="utf-8")
          assert 'viewport-fit=cover' in mobile and 'id="cards"' in mobile, "Mobile puzzle board incomplete"
          assert Path("_site/spider-puzzle/atlas.html").stat().st_size > 1000000, "Source atlas missing"
          import json as spider_json
          owner_blocks = spider_json.loads(Path("_site/spider-puzzle/owner-aliases.json").read_text(encoding="utf-8"))["aliases"]
          assert len(owner_blocks) == 9 and all(block["status"] in ("RED","YELLOW","GREEN","GRAY") for block in owner_blocks), "Owner puzzle contracts invalid"

          assert Path("_site/link-vault/manifest.webmanifest").is_file(), "Link Vault PWA manifest missing"
          assert Path("_site/link-vault/sw.js").is_file(), "Link Vault offline worker missing"
          assert Path("_site/link-vault/privacy-controls.js").is_file(), "Link Vault privacy erasure UI missing"
          for new_asset in ("owner-actions.js","spider-core.js","spider-shell.js","owner-actions.css","owner-actions.json"):
              assert Path("_site/link-vault",new_asset).is_file(), f"Link Vault action overlay missing: {new_asset}"
          page = Path("_site/link-vault/index.html").read_text(encoding="utf-8")
          assert 'href="./owner-actions.css"' in page
          assert page.index("spider-core.js") < page.index("owner-actions.js") < page.index("spider-shell.js")
          assert Path("_site/link-vault/links.json").is_file(), "Refreshable link catalog missing"
          assert Path("_site/link-vault/enhance.js").is_file(), "Link Vault refresh logic missing"
          assert Path("_site/dreamkiller/GameBoy.min.js").stat().st_size > 500000
          assert Path("_site/dreamkiller/road-test.gb").stat().st_size == 32768
          assert Path("_site/dreamkiller/road-v01.gb").stat().st_size == 32768
          from hashlib import sha256
          new_rom = Path("_site/dreamkiller/road-v02.gb")
          assert new_rom.stat().st_size == 32768
          assert sha256(new_rom.read_bytes()).hexdigest() == "df42c2a1d155b929cef09d4648b9ac80e95eb4a6eab8da44da894fa98f57ee2c"
          assert Path("_site/dreamkiller/GPL-2.0.txt").is_file()
          expected = [
              "https://github.com/whoiwts110217-creator/CF-0/blob/main/automation_200/MASTER_OPERATOR_PROMPT.md",
              "https://github.com/whoiwts110217-creator/CF-0/blob/main/docs/START_HERE.md",
              "https://github.com/whoiwts110217-creator/CF-0/tree/feature/ai-agent-tracker/ai_tracker",
          ]
          for name, page in (("homepage", home), ("mission-control", dashboard)):
              for url in expected:
                  assert url in page, f"{name} missing owner shortcut: {url}"
          assert 'href="./mission-control/"' in home, "homepage missing dashboard route"
          assert 'href="../"' in dashboard, "dashboard missing home route"
          print("Owner navigation smoke test passed")
          PY
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  # deploy-pages lists artifacts immediately. Running it in this later job
  # waits until the upload job has finished, so the github-pages artifact is
  # visible. Re-running only this job does not upload a second artifact.
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live Pages release identity and essential public routes
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: python -m site_deploy.verify_live verify "$PAGES_URL" "$GITHUB_SHA" "$GITHUB_RUN_ID"
