name: CF-0 Public Relay Windows Tests
on:
  push:
    paths:
      - 'relay/**'
      - 'link-vault/spider-hp/**'
      - '*CF0*.bat'
      - 'RUN_HP_TAKEOVER_CHECK.bat'
      - 'CHECK_CF0_MAINTENANCE_READ_ONLY.bat'
      - 'HP_TAKEOVER_README.md'
      - 'automation_200/**'
      - 'continuity/**'
      - 'docs/PROJECT_STATUS.md'
      - 'docs/CONTINUITY.md'
      - 'docs/PUBLIC_CONTINUITY_STATE.json'
      - 'docs/PROJECTS.md'
      - 'docs/OWNER_JUNGLE_MAP.md'
      - 'docs/CURRENT_SOURCE_GATEWAY.md'
      - 'docs/UNIVERSAL_FRESHNESS_CONTRACT.md'
      - 'docs/FRESHNESS_CATALOG.json'
      - 'docs/PUBLIC_DEVELOPMENT_SNAPSHOT_2026-11-06.md'
      - 'README.md'
      - '.github/workflows/cf0-relay-tests.yml'
  pull_request:
  workflow_dispatch:
jobs:
  relay:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Offline single-message test
        run: python relay/cf_public_relay.py ping-demo
      - name: Relay regression suite
        run: python -m unittest discover -s relay/tests -v
      - name: CF-200 crash/recovery regression suite
        run: python -m unittest discover -s relay -p test_cf200_recovery.py -v
      - name: Enforce owner capability/source contract (never silently retire Notepad)
        run: python -m automation_200.capability_guard
      - name: Validate CF-200 dependency and evidence invariants
        run: |
          python automation_200/validate_registry.py
          python -m unittest discover -s automation_200/tests -v
      - name: Verify public CF-0 continuity matches the authoritative work order and receipt evidence
        run: python -m automation_200.public_continuity_check
      - name: Test private-local continuity engine using synthetic-only archives
        run: python -m unittest discover -s continuity/tests -v
      - name: Audit moving current-source routes for every catalogued and future public family
        run: python -m continuity.public_freshness
      - name: Verify 200-item ledger
        run: python automation_200/checkpoints.py validate
      - name: Parse Windows PowerShell scripts
        shell: pwsh
        run: |
          $paths=@('relay/install_task.ps1','relay/cf_public_relay_rw.ps1','relay/hp_takeover_check.ps1','relay/configure_health_reporting.ps1','relay/INSTALL_NOTEPAD_CONTROL.ps1')
          foreach($path in $paths) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path).Path, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -ne 0) { $errors | Format-List; exit 1 }
          }
      - name: Refuse false Notepad installation without changing HP state
        shell: pwsh
        run: |
          # A controlled exit code 2 means 'blocked', not an unhandled CI error.
          $PSNativeCommandUseErrorActionPreference = $false
          $result = @(& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File relay/INSTALL_NOTEPAD_CONTROL.ps1)
          if ($LASTEXITCODE -ne 2) { throw 'Legacy Notepad installer must refuse with exit code 2 until restoration is verified' }
          if (($result -join ' ') -notmatch 'NOTEPAD_ACTION=BLOCKED_NOT_SUPPORTED') { throw 'Missing truthful Notepad status' }
          if (($result -join ' ') -notmatch 'LOCAL_CHANGES=NONE') { throw 'Missing no-side-effects assertion' }
          if (($result -join ' ') -match 'NOTEPAD_ACTION=INSTALLED_AND_OPTED_IN') { throw 'False Notepad success report' }
          $global:LASTEXITCODE = 0 # Avoid propagating the expected child exit code to the workflow wrapper.
      - name: Validate free owner-local Spider HP navigator (no desktop actions)
        shell: pwsh
        run: |
          $path='link-vault/spider-hp/Spider-HP.ps1'
          $tokens=$null
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path).Path,[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | Format-List; throw 'Spider HP script PowerShell parser rejected source' }
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $path -Mode Preflight
          if ($LASTEXITCODE -ne 0) { throw 'Spider no-action preflight failed' }
          $native = & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $path -Mode NativeProbe
          if ($LASTEXITCODE -ne 0 -or ($native -join ' ') -notmatch 'NATIVE_UIA_ASSEMBLIES=LOADED') { throw 'Built-in Windows UIAutomation assembly probe failed' }
          foreach($plan in @('notepad-inspect.json','notepad-type-safe.json','calculator-inspect.json')) {
            & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $path -Mode Validate -PlanPath ("link-vault/spider-hp/"+$plan)
            if ($LASTEXITCODE -ne 0) { throw ('Spider plan rejected: '+$plan) }
          }
          $dry = & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $path -Mode Run -PlanPath 'link-vault/spider-hp/notepad-inspect.json'
          if ($LASTEXITCODE -ne 0 -or ($dry -join ' ') -notmatch 'DRY_RUN=NO_UI_ACTIONS') { throw 'Spider dry-run must perform no Windows UI actions' }
          $multi='link-vault/spider-hp/Spider-Multi.ps1'
          $tokens=$null
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $multi).Path,[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | Format-List; throw 'Spider multi-app parser failed' }
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $multi -Mode Validate
          if ($LASTEXITCODE -ne 0) { throw 'Spider multi-app queue failed validation' }
          $multiDry = & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $multi -Mode Run
          if ($LASTEXITCODE -ne 0 -or ($multiDry -join ' ') -notmatch 'DRY_RUN=NO_UI_ACTIONS') { throw 'Spider multi-app dry-run failed' }
          python -m unittest discover -s link-vault/spider-hp/tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Spider source-only safety tests failed' }
      - name: DPAPI encrypted credential round-trip on Windows
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File relay/cf_public_relay_rw.ps1 selftest
          if ($LASTEXITCODE -ne 0) { throw 'DPAPI credential round-trip failed' }
      - name: Offline Windows HP diagnostic
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File relay/hp_takeover_check.ps1 -OfflineOnly
          if ($LASTEXITCODE -ne 0) { throw 'Offline HP diagnostic failed' }
      - name: Read-only HP maintenance audit must never resume tasks
        shell: pwsh
        run: |
          $out = @(& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File relay/hp_takeover_check.ps1 -MaintenanceAudit)
          if ($LASTEXITCODE -ne 0) { throw 'Maintenance status audit failed' }
          $joined = $out -join "`n"
          foreach ($required in @(
            'MAINTENANCE_AUDIT=READ_ONLY',
            'TASK_RELAY=',
            'TASK_FAST_LANE=',
            'TASK_SUPERVISOR=',
            'LOCAL_DISK_FREE_MB=',
            'LOCAL_DISK_BELOW_2GIB=',
            'HP_ORIGIN_PROOF=NOT_ESTABLISHED',
            'SCHEDULER_TO_RECEIPT_PROOF=NOT_ESTABLISHED',
            'TASK_OR_PROCESS_CHANGES=NONE'
          )) {
            if (-not $joined.Contains($required)) { throw ('Maintenance audit missing: ' + $required) }
          }
          $global:LASTEXITCODE = 0
      - name: External Windows read-only relay smoke test without GitHub CLI
        shell: pwsh
        run: |
          $python = (Get-Command python -CommandType Application -TotalCount 1 -ErrorAction Stop).Source
          $emptyPath = Join-Path $env:RUNNER_TEMP 'cf0_empty_path'
          New-Item -ItemType Directory -Path $emptyPath -Force | Out-Null
          $env:PATH = $emptyPath
          Remove-Item Env:CF_RELAY_GITHUB_TOKEN -ErrorAction SilentlyContinue
          if (Get-Command gh.exe -CommandType Application -ErrorAction SilentlyContinue) {
            throw 'GitHub CLI must be unavailable during the transport check'
          }
          & $python relay/cf_public_relay.py once --state-dir "$env:RUNNER_TEMP/cf0_public_relay_probe"
          if ($LASTEXITCODE -ne 0) { throw 'Public relay poll failed' }
          & $python relay/cf_public_relay.py status --state-dir "$env:RUNNER_TEMP/cf0_public_relay_probe"
          if ($LASTEXITCODE -ne 0) { throw 'Public relay status failed' }
