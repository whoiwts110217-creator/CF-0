name: CF-0 Public Dashboard Consistency
on:
  push:
    paths:
      - 'docs/TASKS_AND_ISSUES.md'
      - 'automation_200/registry.json'
      - '.github/workflows/dashboard-guard.yml'
      - 'automation_200/dashboard_guard.py'
      - 'automation_200/tests/test_dashboard_guard.py'
      - 'automation_200/decision_engine.py'
      - 'automation_200/priority_selector.py'
      - 'automation_200/tests/test_retry_boundary_cf118.py'
      - 'automation_200/retry_evidence.py'
      - 'automation_200/tests/test_retry_evidence_cf118.py'
  pull_request:
    paths:
      - 'docs/TASKS_AND_ISSUES.md'
      - 'automation_200/registry.json'
      - '.github/workflows/dashboard-guard.yml'
      - 'automation_200/dashboard_guard.py'
      - 'automation_200/tests/test_dashboard_guard.py'
      - 'automation_200/decision_engine.py'
      - 'automation_200/priority_selector.py'
      - 'automation_200/tests/test_retry_boundary_cf118.py'
      - 'automation_200/retry_evidence.py'
      - 'automation_200/tests/test_retry_evidence_cf118.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-only-dashboard-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out public source
        uses: actions/checkout@v4
      - name: Run offline dashboard checks
        run: python -m unittest discover -s automation_200/tests -p 'test_dashboard_guard.py' -v
      - name: Run CF-118 retry boundary regressions (source-only, no HP)
        run: python -m unittest automation_200.tests.test_retry_boundary_cf118 -v
      - name: Run CF-118 local retry journal regressions (offline)
        run: python -m unittest automation_200.tests.test_retry_evidence_cf118 -v
      - name: Check dashboard snapshot against exact current registry
        run: python automation_200/dashboard_guard.py

  windows-retry-journal-check:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - name: Check out public source
        uses: actions/checkout@v4
      - name: Run CF-118 journal and cross-process locking tests on Windows
        run: python -m unittest automation_200.tests.test_retry_evidence_cf118 -v
      - name: Run CF-118 retry boundary regressions on Windows
        run: python -m unittest automation_200.tests.test_retry_boundary_cf118 -v
