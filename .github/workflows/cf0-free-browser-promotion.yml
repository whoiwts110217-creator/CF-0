name: CF-0 Free Browser Promotion Check

# Distinct from the existing five-minute HP/watchdog automation.
# Public standard runner, pinned to supported Ubuntu 24.04 for Playwright 1.57: no paid API.
on:
  push:
    branches: [main]
    paths:
      - 'finance/donation_growth/free_browser_monitor.py'
      - 'finance/donation_growth/tests/test_free_browser_monitor.py'
      - '.github/workflows/cf0-free-browser-promotion.yml'
  workflow_dispatch:
  schedule:
    # Once daily, off the top of the hour (08:37 EST / 09:37 EDT).
    # Scheduled Actions may be delayed or disabled after long public inactivity.
    - cron: '37 13 * * *'

permissions:
  contents: read

concurrency:
  group: cf0-free-browser-promotion
  cancel-in-progress: false

jobs:
  public-browser-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Test no-cost read-only promotion monitor offline
        run: python -m unittest discover -s finance/donation_growth/tests -p test_free_browser_monitor.py -v

      - name: Install pinned open-source browser driver
        run: python -m pip install 'playwright==1.57.0'

      - name: Install headless Chromium on GitHub runner
        run: python -m playwright install --with-deps chromium

      - name: Verify live public pages and directory listing (GET only)
        run: python finance/donation_growth/free_browser_monitor.py --live --output "$RUNNER_TEMP/cf0-promo-browser.json"

      - name: Explain capability and cost boundaries
        if: always()
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'

          ### Boundaries
          This run used the public repository's standard GitHub-hosted runner.
          No TinyFish, paid API, third-party account, form submission, or
          payment flow was invoked. A CI pass is **not** a donor or visitor.
          Directory approval remains subject to independent publisher review.
          EOF
