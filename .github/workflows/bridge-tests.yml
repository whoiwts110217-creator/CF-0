name: HP Bridge CI (Public Tests Only)
on:
  push:
    paths:
      - 'bridge/**'
      - '.github/workflows/bridge-tests.yml'
  workflow_dispatch:
jobs:
  offline-bridge:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Offline bridge demonstration
        run: python bridge/cf_hp_bridge.py demo
      - name: Python regression suite
        run: python -m unittest discover -s bridge/tests -v
      - name: PowerShell syntax parse (no credentials)
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path bridge/setup_windows.ps1).Path, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -ne 0) { $errors | Format-List; exit 1 }
