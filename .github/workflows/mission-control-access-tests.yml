name: CF-0 Mission Control Access Visibility Tests
on:
  push:
    paths:
      - 'automation_200/mission_control/**'
      - 'link-vault/**'
      - 'docs/PUBLIC_CONTEXT_GRAPH.json'
      - 'i18n/**'
      - 'clarity-brief/**'
      - '.github/ISSUE_TEMPLATE/clarity-brief-pilot.yml'
      - 'clarity-card/**'
      - 'first-drop/**'
      - 'index.html'
      - '.github/workflows/mission-control-access-tests.yml'
  pull_request:
    paths:
      - 'automation_200/mission_control/**'
      - 'link-vault/**'
      - 'docs/PUBLIC_CONTEXT_GRAPH.json'
      - 'i18n/**'
      - 'clarity-brief/**'
      - '.github/ISSUE_TEMPLATE/clarity-brief-pilot.yml'
      - 'clarity-card/**'
      - 'first-drop/**'
      - 'index.html'
      - '.github/workflows/mission-control-access-tests.yml'
permissions:
  contents: read
jobs:
  source-only-access-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Mission Control read-only model and access labels
        run: node --test automation_200/mission_control/tests/*.test.mjs
      - name: Test existing Link Vault and Spider Core without external actions
        run: |
          python -m unittest discover -s link-vault/tests -p 'test_*.py' -v
          node --test link-vault/tests/*.test.mjs
          node --check link-vault/spider-core.js
          node --check link-vault/spider-shell.js
          node --check link-vault/owner-actions.js
          node --check link-vault/sw.js
          python -m continuity.public_topic_router --check-all
      - name: Test standalone Clarity Card functionality and public integrity
        run: node --test clarity-card/tests/*.test.mjs
      - name: Test learning lab at phone-width Chromium viewport
        run: node automation_200/mission_control/tests/browser_smoke.mjs
      - name: Test $15 Clarity Brief public-safe service inquiry and existing links
        run: node --test clarity-brief/tests/*.test.mjs
      - name: Test first-visit homepage at 390px and Spanish switch
        run: node i18n/home.mobile_smoke.mjs
