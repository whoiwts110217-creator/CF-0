name: AI Tracker PR regression tests
on:
  pull_request:
    paths:
      - 'archive/ai_tracker/monitor_public_issue.py'
      - 'archive/ai_tracker/tests/test_monitor_public_issue.py'
      - '.github/workflows/ai-tracker-pr-tests.yml'
permissions:
  contents: read
jobs:
  monitor-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run offline AI Tracker tests
        run: python -m unittest discover -s archive/ai_tracker/tests -p 'test_monitor_public_issue.py' -v
